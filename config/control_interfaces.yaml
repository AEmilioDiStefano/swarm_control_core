# SPDX-License-Identifier: LicenseRef-Vitruvian-Community-1.0
#
# PURPOSE
# - Defines reusable controller/actuation backend templates.
# - This is the "what backend we command" layer (GPIO mappings, controller params).
#
# HOW THIS RELATES TO THE SYSTEM
# - Referenced by `robot_instances.yaml` via `control_interface`.
# - Resolved by `swarm_control_core/drive_profiles.py` into the runtime hardware block.
# - Designed to be transport/backend-agnostic (ground/air/marine capable naming).
#
# MUTABILITY / OWNERSHIP
# - Repository copy is the baseline template library.
# - Site-specific overrides belong in machine-local config, not git.
#
# WHAT THIS OFFERS
# - Reusable backend definitions across multiple control types and vendors.
# - Decouples kinematics from low-level wiring and safety limits.

schema_version: "1.0"

defaults:
  control_interface: l298n_diff

control_interfaces:
  l298n_diff:
    aliases:
      - L298N_diff
    compatible_control_types:
      - diff_drive
    backend: gpio_hbridge
    wheel_layout: side_pair
    controller:
      model: L298N
      count: 1
    docs:
      wiring: DOCS/GPIO/GPIO_for_differential_L298N.md
    gpio:
      en_left: 12
      in1_left: 17
      in2_left: 27
      en_right: 13
      in1_right: 22
      in2_right: 23
    params:
      pwm_hz: 1000
      max_pwm: 100
      pwm_ramp_ms: 0
      pwm_deadband_pct: 0
      cmd_rate_hz: 0
      pwm_slew_pct_per_s: 0

  dual_l298n_diff:
    aliases:
      - dual_L298N_diff
    compatible_control_types:
      - diff_drive
    backend: gpio_hbridge
    wheel_layout: four_wheel
    controller:
      model: L298N
      count: 2
    docs:
      wiring: DOCS/GPIO/GPIO_for_differential_DUAL_L298N.md
    gpio:
      # L298N #1, Channel A -> left-front motor
      fl_pwm: 12
      fl_in1: 5
      fl_in2: 6
      # L298N #2, Channel A -> right-front motor
      fr_pwm: 13
      fr_in1: 16
      fr_in2: 19
      # L298N #1, Channel B -> left-rear motor
      rl_pwm: 18
      rl_in1: 20
      rl_in2: 21
      # L298N #2, Channel B -> right-rear motor
      rr_pwm: 26
      rr_in1: 23
      rr_in2: 24
    params:
      pwm_hz: 1000
      max_pwm: 100
      pwm_ramp_ms: 40
      pwm_deadband_pct: 0
      cmd_rate_hz: 0
      pwm_slew_pct_per_s: 0

  dual_l298n_mecanum:
    aliases:
      - dual_L298N_mecanum
    compatible_control_types:
      - mecanum_drive
    backend: gpio_hbridge
    wheel_layout: four_wheel
    controller:
      model: L298N
      count: 2
    docs:
      wiring: DOCS/GPIO/GPIO_for_mecanum_DUAL_L298N.md
    gpio:
      # L298N #1, Channel A -> front-left mecanum wheel
      fl_pwm: 12
      fl_in1: 5
      fl_in2: 6
      # L298N #1, Channel B -> front-right mecanum wheel
      fr_pwm: 13
      fr_in1: 16
      fr_in2: 19
      # L298N #2, Channel A -> rear-left mecanum wheel
      rl_pwm: 18
      rl_in1: 20
      rl_in2: 21
      # L298N #2, Channel B -> rear-right mecanum wheel
      rr_pwm: 26
      rr_in1: 23
      rr_in2: 24
    params:
      pwm_hz: 1000
      max_pwm: 100
      pwm_ramp_ms: 40
      pwm_deadband_pct: 0
      cmd_rate_hz: 0
      pwm_slew_pct_per_s: 0

  dual_tb6612_mecanum:
    compatible_control_types:
      - mecanum_drive
    backend: gpio_hbridge
    wheel_layout: four_wheel
    controller:
      model: TB6612
      count: 2
    docs:
      wiring: DOCS/GPIO/GPIO_for_mecanum_Tb6612_DUAL.md
    gpio:
      fl_pwm: 12
      fl_in1: 5
      fl_in2: 6
      fr_pwm: 13
      fr_in1: 16
      fr_in2: 19
      rl_pwm: 18
      rl_in1: 20
      rl_in2: 21
      rr_pwm: 26
      rr_in1: 23
      rr_in2: 24
    params:
      pwm_hz: 1000
      max_pwm: 100
      pwm_ramp_ms: 0
      pwm_deadband_pct: 0
      cmd_rate_hz: 0
      pwm_slew_pct_per_s: 0

  dual_tb6612_diff_4wheel_tracked:
    aliases:
      - dual_tb6612_diff
    compatible_control_types:
      - diff_drive
    backend: gpio_hbridge
    wheel_layout: front_pair
    controller:
      model: TB6612
      count: 2
    docs:
      wiring: DOCS/GPIO/GPIO_for_differential_Tb6612_DUAL.md
    gpio:
      fl_pwm: 12
      fl_in1: 5
      fl_in2: 6
      fr_pwm: 18
      fr_in1: 23
      fr_in2: 24
    params:
      pwm_hz: 1000
      max_pwm: 100
      pwm_ramp_ms: 80
      pwm_deadband_pct: 2
      cmd_rate_hz: 0
      pwm_slew_pct_per_s: 0
