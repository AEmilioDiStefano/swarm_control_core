# SPDX-License-Identifier: LicenseRef-Vitruvian-Community-1.0
#
# PURPOSE
# - Defines declared command/autonomy/sensor capability contracts by robot class.
#
# HOW THIS RELATES TO THE SYSTEM
# - Referenced by `robot_instances.yaml` via `capability_profile`.
# - Used to gate operator/orchestrator actions against supported behavior.
# - Complements (does not replace) control type + control interface definitions.
# - Pair with `adapter_profiles.yaml` to expose capability-consistent external interfaces.
#
# MUTABILITY / OWNERSHIP
# - Baseline profiles live in repo.
# - Site-specific capability policy can override via machine-local path.
#
# WHAT THIS OFFERS
# - Consistent capability semantics across vendors.
# - Explicit contract for UI/orchestrator command enablement.

schema_version: "1.0"

defaults:
  capability_profile: ground_diff_basic

capability_profiles:
  ground_diff_basic:
    mobility:
      forward: true
      backward: true
      rotate_left: true
      rotate_right: true
      strafe_left: false
      strafe_right: false
      stop_in_place: true
    autonomy:
      execute_playbook: true
      move_xy: true
      transit_distance: true
      rotate_degrees: true
    sensors:
      camera_required: false
      heading_required: false

  ground_omni_basic:
    mobility:
      forward: true
      backward: true
      rotate_left: true
      rotate_right: true
      strafe_left: true
      strafe_right: true
      stop_in_place: true
    autonomy:
      execute_playbook: true
      move_xy: true
      transit_distance: true
      rotate_degrees: true
    sensors:
      camera_required: false
      heading_required: false
