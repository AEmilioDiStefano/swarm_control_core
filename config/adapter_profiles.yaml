# SPDX-License-Identifier: Apache-2.0
#
# PURPOSE
# - Defines robot-edge adapter templates that translate between swarm_control_core's
#   normalized command/state contracts and robot-local transport/controller stacks.
#
# HOW THIS RELATES TO THE SYSTEM
# - Referenced by `robot_instances.yaml` via `adapter_profile`.
# - Loaded by `swarm_control_core/drive_profiles.py` and resolved alongside:
#   - `control_types.yaml`
#   - `control_interfaces.yaml`
#   - `capability_profiles.yaml`
# - Adapter metadata is returned by `resolve_robot_profile()` for runtime use
#   by orchestration/integration layers.
# - Runtime dispatch is applied in active flows (for example FPV UI command ingress
#   and fleet-state egress) via `swarm_control_core/adapter_runtime.py`.
#
# MUTABILITY / OWNERSHIP
# - Repository copy is baseline template library.
# - Site-specific adapter tuning should be copied to machine-local config
#   (`~/.config/swarm_control_core/adapter_profiles.yaml`) and selected via
#   `ADAPTER_PROFILES_PATH` or by colocating with `robot_instances.yaml`.
#
# WHAT THIS OFFERS
# - Decouples robot onboarding from direct GPIO coupling.
# - Enables heterogeneous robot support by selecting adapter backends per robot
#   without changing core control nodes.

schema_version: "1.0"

defaults:
  adapter_profile: passthrough_local

adapter_profiles:
  passthrough_local:
    adapter: passthrough
    description: Direct robot-local execution path with no external schema translation.
    transport: ros2_local
    params:
      command_source: ros2_topic_cmd_vel
      telemetry_source: ros2_topics
      require_heartbeat: true
