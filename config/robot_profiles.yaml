# SPDX-License-Identifier: Apache-2.0
#
# PURPOSE
# - Defines robot drive/hardware behavior contracts for all runtime nodes.
# - Legacy monolithic format retained for backward compatibility.
# - New preferred split format uses:
#   - `robot_instances.yaml`
#   - `control_types.yaml`
#   - `control_interfaces.yaml`
#   - `capability_profiles.yaml`
#   - `adapter_profiles.yaml`
#
# HOW THIS RELATES TO THE SYSTEM
# - Read by `swarm_control_core/drive_profiles.py`, then consumed by:
#   - `motor_driver_node.py`
#   - `heartbeat_node.py`
#   - `unit_executor_action_server.py`
# - Works together with `config/camera_profiles.yaml`:
#   - this file handles kinematics, limits, GPIO/hardware tuning
#   - camera settings must remain in `camera_profiles.yaml`
#
# MUTABILITY / OWNERSHIP
# - Repository copy is the authoritative engineering baseline.
# - Site/robot runtime overrides should be copied to a machine-local path
#   (recommended: `~/.config/swarm_control_core/robot_profiles.yaml`) and passed via
#   `--profiles-path` / `profiles_path:=` so Git normalization does not discard
#   deployment-specific tuning.
#
# WHAT THIS OFFERS
# - Deterministic behavior across robot classes.
# - A single source of truth for safety constraints and hardware mapping.
# - Clear package boundary for future profile types without coupling concerns.
#
# ⭐ Relationship to drive_types.py:
# - This YAML selects each robot's drive_profile + hardware_profile.
# - drive_types.py uses drive_profile.type to choose the mixing logic for Twist.
#
# IMPORTANT:
# - Camera settings DO NOT belong in this file.
# - Keep camera device/fps/width/height/fourcc/force_v4l2 only in:
#     config/camera_profiles.yaml
#   (or pass explicit launch camera_* args for temporary overrides).

schema_version: "1.0"

defaults:
  drive_profile: diff_drive
  hardware_profile: L298N_diff

# ------------------------------------------------------------------------------
# Params Reference (supported keys)
#
# drive_profiles.*.params:
#   wheel_base_m              (float)  Wheel base / separation used by diff-drive math
#   track_width_m             (float)  Omni/mecanum track width (future use)
#   max_linear_mps            (float)  Max linear speed clamp
#   max_angular_rps           (float)  Max angular speed clamp
#   watchdog_timeout_s        (float)  Motor driver cmd timeout
#   spin_speed_mult           (float)  Tank-spin speed multiplier (0..1)
#   stall_timeout_s           (float)  Time allowed above stall_duty_pct before cutting output
#   stall_duty_pct            (float)  Duty threshold considered "stalled"
#   teleop_linear_mps         (float)  Teleop base linear speed
#   teleop_angular_rps        (float)  Teleop base angular speed
#   teleop_speed_step         (float)  Teleop speed step multiplier
#   teleop_medium_steps       (int)    Steps from base to medium
#   teleop_fast_linear_steps  (int)    Steps from base to fast linear
#   teleop_fast_angular_steps (int)    Steps from base to fast angular
#   teleop_omni_turn_gain     (float)  Omni circle-turn angular gain (multiplies angular speed)
#   teleop_smoothing_alpha    (float)  Twist smoothing factor (0=off, 1=very smooth)
#   teleop_diff_arc_inner_ratio (float) Differential-drive inner-track ratio for 7/9/1/3 arc turns
#   fpv_lease_ttl_sec         (float)  FPV claim lease TTL
#
# hardware_profiles.*.params:
#   pwm_hz   (int)   PWM frequency
#   max_pwm  (int)   PWM duty cap (0..100)
#   pwm_ramp_ms       (float) Soft-start ramp time for 0->100% duty
#   pwm_deadband_pct  (float) Duty below this is treated as 0
#   cmd_rate_hz       (float) Max motor command update rate (0 = no limit)
#   pwm_slew_pct_per_s (float) Max duty change per second (0 = no limit)
#   strict_single_cmd_vel_publisher (bool) Gate non-stop motor commands if >1 cmd_vel publishers
#   strict_cmd_vel_exempt_publishers (list[str]) Publisher node names ignored by strict cmd_vel gating
#   allow_rotate_bypass_safety (bool) If true, in-place rotate commands bypass PWM ramp/deadband
#
# robots.*.params (per-robot overrides):
#   drive: { ... any drive params above ... }
#   hardware: { ... any hardware params above ... }
# ------------------------------------------------------------------------------

robots:
  # Differential-drive robots
  robot1:
    drive_profile: diff_drive
    hardware_profile: dual_tb6612_diff
    params:
      drive:
        # Test tune: stronger response while keeping conservative safety margins.
        max_linear_mps: 0.22
        max_angular_rps: 0.90
        spin_speed_mult: 0.45
        watchdog_timeout_s: 0.25
        teleop_linear_mps: 0.18
        teleop_angular_rps: 0.70
        teleop_diff_arc_inner_ratio: 0.75
        teleop_smoothing_alpha: 0.25
        stall_timeout_s: 0
        stall_duty_pct: 0
      hardware:
        max_pwm: 68
        pwm_ramp_ms: 140
        pwm_deadband_pct: 3
        cmd_rate_hz: 30
        pwm_slew_pct_per_s: 180
        strict_single_cmd_vel_publisher: true
        strict_cmd_vel_exempt_publishers:
          - unit_executor_action_server
        allow_rotate_bypass_safety: false

  robot2:
    drive_profile: mecanum_drive
    hardware_profile: dual_tb6612_mecanum
    params:
      drive:
        # Field calibration update (latest):
        # - command 1.00 m -> observed ~0.60..0.70 m
        # - command 90 deg -> observed ~50..60 deg
        orchestrator_linear_duration_scale: 1.55
        orchestrator_angular_duration_scale: 1.65
        # Safety tune for V-path planner load:
        # reduce detour aggressiveness on robot2 to limit current spikes.
        orchestrator_max_detour_scale: 0.45
        # Restore stronger response while staying below max-stress settings.
        max_linear_mps: 0.40
        max_angular_rps: 1.8
        spin_speed_mult: 0.75
        # Disable stall-cut here; it can look like periodic pauses during
        # sustained forward teleop when duty stays above threshold.
        stall_timeout_s: 0
        stall_duty_pct: 0
      hardware:
        # Faster onset, less "weak start", still with bounded slew.
        max_pwm: 90
        pwm_ramp_ms: 40
        pwm_deadband_pct: 2
        cmd_rate_hz: 50
        pwm_slew_pct_per_s: 400

  robot3:
    drive_profile: diff_drive
    hardware_profile: L298N_diff
    params:
      drive:
        # Field calibration update (latest):
        # - command 1.00 m -> observed ~1.10..1.20 m
        # - command 90 deg -> observed ~80..85 deg
        orchestrator_linear_duration_scale: 0.97
        orchestrator_angular_duration_scale: 1.32
        # Slight left drift correction (increase left side a bit).
        left_speed_scale: 1.04
        right_speed_scale: 1.00

  # Omni robot (TB6612 x2)
  robot_omni:
    drive_profile: mecanum_drive
    hardware_profile: dual_tb6612_mecanum

drive_profiles:
  diff_drive:
    type: diff_drive
    params:
      # Primary drive constraints
      wheel_base_m: 0.18
      max_linear_mps: 0.4
      max_angular_rps: 2.0
      watchdog_timeout_s: 0.5
      spin_speed_mult: 0.7
      stall_timeout_s: 0
      stall_duty_pct: 0

      # Teleop defaults (keyboard)  
      teleop_linear_mps: 0.5
      teleop_angular_rps: 1.0
      teleop_speed_step: 1.1
      teleop_medium_steps: 10
      teleop_fast_linear_steps: 15
      teleop_fast_angular_steps: 10
      teleop_omni_turn_gain: 0.5
      teleop_smoothing_alpha: 0.0

      # FPV defaults
      fpv_lease_ttl_sec: 3.0

  mecanum_drive:
    type: omni
    params:
      # These are placeholders for configuring proper kinematics  
      wheel_base_m: 0.18
      track_width_m: 0.18
      max_linear_mps: 0.4
      max_angular_rps: 2.0
      watchdog_timeout_s: 0.5
      spin_speed_mult: 0.7
      stall_timeout_s: 0
      stall_duty_pct: 0

      # Teleop defaults (keyboard)
      teleop_linear_mps: 0.5
      teleop_angular_rps: 1.0
      teleop_speed_step: 1.1
      teleop_medium_steps: 10
      teleop_fast_linear_steps: 15
      teleop_fast_angular_steps: 10
      teleop_omni_turn_gain: 0.5
      teleop_smoothing_alpha: 0.0

      # FPV defaults
      fpv_lease_ttl_sec: 3.0

hardware_profiles:
  # --------------------------------------------------------------------------
  # Differential drive: 2-channel H-bridge style wiring
  #
  # Your provided mapping:
  #   ENA to GPIO 12 (PWM0)
  #   IN1 to GPIO 23
  #   IN2 to GPIO 22
  #   IN3 to GPIO 27
  #   IN4 to GPIO 17
  #   ENB to GPIO 13 (PWM1)
  #
  # We interpret that as:
  #   left motor  -> ENA + IN1/IN2
  #   right motor -> ENB + IN3/IN4
  # --------------------------------------------------------------------------
  L298N_diff:
    gpio:
      en_left: 12
      in1_left: 17
      in2_left: 27

      en_right: 13
      in1_right: 22
      in2_right: 23
    params:
      pwm_hz: 1000
      max_pwm: 100
      pwm_ramp_ms: 0
      pwm_deadband_pct: 0
      cmd_rate_hz: 0
      pwm_slew_pct_per_s: 0

  # --------------------------------------------------------------------------
  # Omni: two TB6612 boards (4 motor channels)
  #
  # Your provided mapping:
  #
  # TB6612 #1 (Front motors)
  #   Front-Left (Motor A)
  #     PWMA → GPIO 12 (PWM)
  #     AIN1 → GPIO 5
  #     AIN2 → GPIO 6
  #   Front-Right (Motor B)
  #     PWMB → GPIO 13 (PWM)
  #     BIN1 → GPIO 16
  #     BIN2 → GPIO 19
  #
  # TB6612 #2 (Rear motors)
  #   Rear-Left (Motor A)
  #     PWMA → GPIO 18 (PWM)
  #     AIN1 → GPIO 20
  #     AIN2 → GPIO 21
  #   Rear-Right (Motor B)
  #     PWMB → GPIO 26 (PWM)
  #     BIN1 → GPIO 23
  #     BIN2 → GPIO 24
  # --------------------------------------------------------------------------
  dual_tb6612_mecanum:
    gpio:
      fl_pwm: 12
      fl_in1: 5
      fl_in2: 6

      fr_pwm: 13
      fr_in1: 16
      fr_in2: 19

      rl_pwm: 18
      rl_in1: 20
      rl_in2: 21

      rr_pwm: 26
      rr_in1: 23
      rr_in2: 24
    params:
      pwm_hz: 1000
      max_pwm: 100
      pwm_ramp_ms: 0
      pwm_deadband_pct: 0
      cmd_rate_hz: 0
      pwm_slew_pct_per_s: 0

  # Differential-drive wiring using TWO TB6612 boards (left and right pairs)
  # Specific to paired-motor tank-style setups:
  #   Left Front + Left Rear share the SAME signals
  #   Right Front + Right Rear share the SAME signals
  # Matches wiring in GPIO_for_differential_Tb6612_DUAL.md
  dual_tb6612_diff:
    gpio:
      # LEFT side (TB6612 #1)
      # Channel A + B are tied together in hardware to receive identical commands.
      fl_pwm: 12
      fl_in1: 5
      fl_in2: 6

      # RIGHT side (TB6612 #2)
      # Channel A + B are tied together in hardware to receive identical commands.
      fr_pwm: 18
      fr_in1: 23
      fr_in2: 24
    params:
      pwm_hz: 1000
      max_pwm: 100
      pwm_ramp_ms: 80
      pwm_deadband_pct: 2
      cmd_rate_hz: 0
      pwm_slew_pct_per_s: 0

    # If physical wiring yields reversed polarity, set these flags per-robot
    # invert_left: false
    # invert_right: false
